[package]
name = "grimoire-worker"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
grimoire-domain = { path = "../domain" }
chrono.workspace = true
worker = { version = "0.8.7", features = ["d1", "http", "axum"] }
worker-macros = { version = "0.8.7", features = ["http"] }
axum = { version = "0.8", default-features = false, features = ["json", "query"] }
tower-service = "0.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
uuid = { version = "1.29", default-features = false, features = ["std", "v7", "js"] }

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
