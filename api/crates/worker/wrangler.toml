name = "grimoire"
main = "build/index.js"
compatibility_date = "2026-10-29"
workers_dev = true
# sin URLs por versión: la única URL pública es la de workers.dev
preview_urls = false

[build]
command = "cargo install -q \"worker-build@^0.8\" && worker-build --release"

[vars]
GRIMOIRE_TZ = "America/Bogota"
# Origen del WebView de la APK: Capacitor v8 en Android, androidScheme "https" +
# hostname "localhost" por defecto. Un solo origen, sin comodín.
CORS_ORIGIN = "https://localhost"

# La web del PC (fase-2-transversal.md, 2.5.6), en el mismo origen que la API. Un archivo que existe
# se sirve sin pasar por el worker ni por el bearer: es el código público del repo. Sin archivo, una
# navegación (`Sec-Fetch-Mode: navigate`) recibe index.html y lo demás va al worker; así `fetch`
# de `/pomodoro/today` llega a la API aunque `/pomodoro` sea ruta de la app. Lo hace
# `assets_navigation_prefers_asset_serving`, activo por la compatibility_date (>= 2025-04-01).
# Hay que construir `app/` (`npm run build`) antes de `wrangler dev` o `deploy`.
[assets]
directory = "../../../app/dist"
not_found_handling = "single-page-application"

# database_id no es una credencial: sin un token de API de la cuenta no da acceso.
[[d1_databases]]
binding = "DB"
database_name = "grimoire"
database_id = "7295c42d-71fa-4b6c-a25a-906119dca367"
migrations_dir = "../../migrations"

# Entorno de medición (fase-2-transversal.md, 2.5.4): mismo código y runtime, su propio worker y su
# propia D1, para cargar seeds sin tocar producción. `vars` y `d1_databases` no se heredan.
[env.bench]
name = "grimoire-bench"
workers_dev = true
preview_urls = false

[env.bench.vars]
GRIMOIRE_TZ = "America/Bogota"
CORS_ORIGIN = "https://localhost"

[[env.bench.d1_databases]]
binding = "DB"
database_name = "grimoire-bench"
database_id = "a2723736-bceb-47f4-9827-3c5c363c2443"
migrations_dir = "../../migrations"
