name = "grimoire"
main = "build/index.js"
compatibility_date = "2026-10-29"
workers_dev = true
# sin URLs por versión: la única URL pública es la de workers.dev
preview_urls = false

[build]
command = "cargo install -q \"worker-build@^0.8\" && worker-build --release"

[vars]
GRIMOIRE_TZ = "America/Bogota"
# Origen del WebView de la APK: Capacitor v8 en Android, androidScheme "https" +
# hostname "localhost" por defecto. Un solo origen, sin comodín.
CORS_ORIGIN = "https://localhost"

# database_id no es una credencial: sin un token de API de la cuenta no da acceso.
[[d1_databases]]
binding = "DB"
database_name = "grimoire"
database_id = "7295c42d-71fa-4b6c-a25a-906119dca367"
migrations_dir = "../../migrations"
